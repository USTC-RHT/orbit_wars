# RL 训练默认配置。
# 这里集中控制环境编码、reward shaping、网络大小和 PPO 超参数。
# 命令行参数可以临时覆盖 updates/num-envs/rollout-steps/device/run-name/opponent。

seed: 42
run_name: "0511_target_filter_no_combat"
device: auto
save_dir: outputs
checkpoint_every: 100
log_every: 1
opponent: mixed
opponent_pool: [nearest, self, sigmaborov-reinforce]
opponent_pool_weights: [0.5, 0.2, 0.3]
self_play_update_interval: 25
self_play_deterministic: true
alternate_player_sides: true

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  # Proto-guided target mask：全量星球仍进入特征/池化，动作 softmax 只开放少量候选。
  target_filter_enabled: true
  # 进攻候选：按 Proto 分数保留前 6 个非友方目标。
  attack_top_k: 6
  # 防守/输送候选：只保留 defense_pressure 最大的 3 个友方星球。
  defense_top_k: 3


# 应该要有时间惩罚？
# 发射这个动作需要有惩罚，避免无效发射以及送死行为，从而不用硬约束发射的数量。

reward:
  # 终局胜负奖励权重：必须开启，否则模型完全感知不到游戏胜负。
  terminal_weight: 1.0
  # 我方星球上船数变化奖励：保留 0，避免与 production/planet shaping 重复计数。
  ships_weight: 0
  # 我方总生产力变化奖励：dense shaping 系数缩小，避免淹没终局信号。
  production_weight: 0.04
  # 我方星球数量变化奖励：同步缩小。
  planet_weight: 0.03
  # 时间惩罚：先关掉，nearest 对手不会拖时间，惩罚反而鼓励冒险送兵。
  time_penalty: 0.0
  # 发射惩罚：关闭无差别惩罚，改用 wasted_attack_penalty 只罚送兵失败。
  launch_penalty: 0.0
  # 早期占领中立星球奖励：鼓励先吃近处中立，按 exp(-ETA/scale) 和开局衰减。
  neutral_capture_weight: 0.05
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  # 单步 shaped reward 裁剪：保护 dense reward 不会单步爆掉，盖过 terminal。
  step_clip: 0.05

model:
  hidden_size: 128
  use_cnn: True

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

eval:
  enabled: true
  every: 50
  games: 50
  seed: 100000

ppo:
  rollout_steps: 128
  num_envs: 8
  total_updates: 2000
  epochs: 4
  minibatch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.02
  lr: 0.0003
  max_grad_norm: 0.5
  anneal_lr: false
  norm_adv: true
  clip_vloss: false
  target_kl: 0.03

wandb:
  enabled: True
  project: orbit-wars-rl
  entity:
  mode: online
  group:
  tags:
    - ppo
    - nearest
