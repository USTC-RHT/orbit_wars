# 自主迭代实验：mixed opponent pool
# 目标：解决 v3 RL overfit nearest 的问题
# 用 nearest(40%) + sigmaborov(30%) + self-play(30%) 混合训练

seed: 42
run_name: "0512_mixed_pool"
device: auto
save_dir: outputs
checkpoint_every: 100
log_every: 1
opponent: mixed
opponent_pool:
  - nearest
  - sigmaborov-reinforce
  - self
opponent_pool_weights:
  - 0.4
  - 0.3
  - 0.3
self_play_update_interval: 25
self_play_deterministic: true
alternate_player_sides: true

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 6
  defense_top_k: 3

reward:
  terminal_weight: 1.0
  ships_weight: 0
  production_weight: 0.04
  planet_weight: 0.03
  fleet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.05
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  step_clip: 0.05

model:
  hidden_size: 128
  use_cnn: True

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

eval:
  enabled: true
  every: 100
  games: 50
  seed: 100000

ppo:
  rollout_steps: 128
  num_envs: 8
  total_updates: 3000
  epochs: 4
  minibatch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.02
  lr: 0.0003
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: false
  target_kl: 0.03

wandb:
  enabled: false
  project: orbit-wars-rl
  entity:
  mode: online
  group:
  tags:
    - ppo
    - mixed
    - self-play
