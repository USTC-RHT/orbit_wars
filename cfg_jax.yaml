# Reconstructed from:
#   checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl
#
# This is the saved training config for update 32700. It is the source
# checkpoint exported into:
#   agents/mine/fixed-pool-tgtmask-0526-ckpt32700-onnx-producer-hybrid
#
# Hardware note:
#   The original wandb group/tags identify this as an autoregressive RTX 4090 run.
#
# Launch:
#   python -m jax_agent.train_jax --config cfg_jax_fixed_pool_with_tgtmask_0526_ckpt32700.yaml

seed: 42
run_name: "fixed_pool_with_tgtmask-0617"
device: auto
save_dir: ../kaggle
checkpoint_every: 500
log_every: 1
opponent: "pool"

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 10
  defense_top_k: 5

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  actor_type: autoregressive
  hidden_size: 512
  use_cnn: true
  use_transformer: true
  num_transformer_layers: 5
  num_heads: 8
  max_fleet_tokens: 32
  fleet_selection: size
  max_action_tokens: 12
  end_bias_init: -3.0

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  rollout_steps: 128
  num_envs: 160
  total_updates: 50000
  epochs: 1
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_fire: 0.005
  ent_coef_target: 0.01
  ent_coef_amount: 0.005
  ent_schedule: linear
  ent_min_ratio: 0.2
  lr: 5.0e-5
  lr_schedule: warmup_cosine
  warmup_updates: 50
  min_lr_ratio: 0.1
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  target_kl: 0.02

self_play_update_interval: 50
pool_mode: fixed_pool
pool_start_phase: 1
pool_lag_interval: 50
promote_nearest_win_rate: 1.0
promote_consecutive_evals: 2

eval:
  enabled: true
  every: 1000
  nearest_every: 50
  slow_every: 500
  games: 20
  seed: 200000
  opponents: ["nearest", "ckpt_32700", "ckpt_48900", "tamrazov"]

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
  group: "autoregressive-4090"
  tags:
    - autoregressive
    - v1
    - fixed_pool
    - rtx4090
