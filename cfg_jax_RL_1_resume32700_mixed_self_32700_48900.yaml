# Resume target-mask post-discard training from the fixed_pool_with_tgtmask-0526
# ckpt_032700 checkpoint. Opponents are sampled uniformly from:
# current self-play, ckpt_032700, ckpt_048900.
#
# Launch:
#   PYTHONPATH=. python -m jax_agent.train_jax --config cfg_jax_RL_1_resume32700_mixed_self_32700_48900.yaml

seed: 42
run_name: "fixed_pool_tgtmask_post_discard-resume32700-0617"
device: auto
save_dir: outputs
checkpoint_every: 500
log_every: 1
opponent: "pool"

init_from_checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl
start_update_from_checkpoint: true

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 10
  defense_top_k: 5
  target_attack_ships_pre_mask: false
  post_discard_attackable_check: true

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  actor_type: autoregressive
  hidden_size: 128
  use_cnn: true
  use_transformer: true
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16
  fleet_selection: size
  max_action_tokens: 12
  end_bias_init: -3.0

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  rollout_steps: 128
  num_envs: 160
  total_updates: 50000
  epochs: 4
  minibatch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_fire: 0.005
  ent_coef_target: 0.01
  ent_coef_amount: 0.005
  ent_schedule: linear
  ent_min_ratio: 0.2
  lr: 5e-5
  lr_schedule: warmup_cosine
  warmup_updates: 50
  min_lr_ratio: 0.1
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  target_kl: 0.02

self_play_update_interval: 50
pool_mode: mixed
opponent_pool:
  - name: self
    type: self
    weight: 1.0
  - name: ckpt_32700
    type: jax_checkpoint
    weight: 1.0
    checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl
    opponent_feature_mode: pre_mask
  - name: ckpt_48900
    type: jax_checkpoint
    weight: 1.0
    checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_048900.pkl
    opponent_feature_mode: pre_mask

eval:
  enabled: true
  every: 1000
  nearest_every: 0
  slow_every: 500
  games: 20
  seed: 200000
  player: 1
  opponents: ["ckpt_32700", "ckpt_48900"]

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
  group: "autoregressive-4090"
  tags:
    - autoregressive
    - v1
    - target-mask-post-discard
    - resume32700
    - mixed-self-32700-48900
