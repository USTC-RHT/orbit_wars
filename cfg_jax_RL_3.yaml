# RL_3 配置差异：
# - 从 fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl 续训。
# - 保持 target-mask / autoregressive / impact fleet token 选择逻辑。
# - mixed 训练池：60% current-policy self-play，20% ckpt48900，20% ckpt32700。
# - 两个 checkpoint 对手均使用 rl-agent/checkpoints 内的 JAX checkpoint。
# - checkpoint 对手走 JAX 并行环境，不经过 ONNX/Kaggle Python rollout 慢路径。
# - producer 不作为训练对手，也不作为评估对象。
#
# Launch:
#   python -m jax_agent.train_jax --config cfg_jax_RL_3.yaml
#
# JAX-native checkpoint 对战显存档：
# - 64 x 64 = 4096 samples/update，适合 24GB 显存。
# - 若仍 OOM，可先命令行覆盖 --num-envs 64 --rollout-steps 32。

seed: 42
run_name: "RL_3_ckpt32700_resume_jax"
device: auto
save_dir: outputs
checkpoint_every: 400
log_every: 1
opponent: "pool"
init_from_checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl
start_update_from_checkpoint: true

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 10
  defense_top_k: 5

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  actor_type: autoregressive
  hidden_size: 128
  use_cnn: true
  use_transformer: true
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 40
  fleet_selection: impact
  max_action_tokens: 12
  end_bias_init: -3.0

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  rollout_steps: 64
  num_envs: 128
  total_updates: 50000
  epochs: 4
  minibatch_size: 1024
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_fire: 0.005
  ent_coef_target: 0.01
  ent_coef_amount: 0.005
  ent_schedule: linear
  ent_min_ratio: 0.2
  lr: 5e-5
  lr_schedule: warmup_cosine
  warmup_updates: 50
  min_lr_ratio: 0.1
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  target_kl: 0.02

self_play_update_interval: 1
pool_mode: mixed
opponent_pool:
  # 60% current-policy self-play.
  - name: self_play
    type: self
    weight: 0.60

  # 40% old strongest JAX checkpoints, split between ckpt 48900 and 32700.
  - name: ckpt_48900
    type: jax_checkpoint
    weight: 0.20
    checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_048900.pkl
  - name: ckpt_32700
    type: jax_checkpoint
    weight: 0.20
    checkpoint: checkpoints/fixed_pool_with_tgtmask-0526_jax/ckpt_032700.pkl
pool_lag_interval: 50
promote_nearest_win_rate: 1.0
promote_consecutive_evals: 2

eval:
  enabled: true
  every: 400
  nearest_every: 0
  slow_every: 400
  games: 20
  seed: 200000
  player: 1
  opponents: ["ckpt_48900", "ckpt_32700", "tamrazov", "pool_ckpt900"]

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
  group: "autoregressive-4090"
  tags:
    - autoregressive
    - v1
    - ckpt32700_resume
    - mixed_jax_checkpoints
    - rtx4090
