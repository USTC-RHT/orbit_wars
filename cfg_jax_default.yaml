# JAX 全速训练默认配置。
# 对应 jax_agent/train_jax.py，与 PyTorch 配置格式兼容，可直接传给 load_config()。
# JAX 版通过 vmap 批量并行环境，编译后无 Python GIL 开销，可支持更大 num_envs。
#
# 启动示例（从 rl-agent/ 目录）：
#   python -m jax_agent.train_jax --config cfg_jax_default.yaml
#   python -m jax_agent.train_jax --config cfg_jax_default.yaml --num-envs 512 --updates 5000
#
# State bank：首次运行会自动在 outputs/jax_initial_state_bank.npz 生成初始局面缓存。
# 可用 --bank 指定其他路径，--bank-size 控制缓存局面数量（默认 256）。

seed: 42
run_name: "jax_default"
save_dir: outputs

env:
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  # Proto-guided target mask：全量星球仍进入特征/池化，动作 softmax 只开放少量候选。
  target_filter_enabled: true
  # 进攻候选：按 Proto 分数保留前 6 个非友方目标。
  attack_top_k: 6
  # 防守/输送候选：只保留 defense_pressure 最大的 3 个友方星球。
  defense_top_k: 3

reward:
  # 终局胜负奖励权重：必须开启，否则模型完全感知不到游戏胜负。
  terminal_weight: 1.0
  # 我方星球上船数变化奖励：保留 0，避免与 production/planet shaping 重复计数。
  ships_weight: 0
  # 我方总生产力变化奖励：dense shaping 系数缩小，避免淹没终局信号。
  production_weight: 0.04
  # 我方星球数量变化奖励。
  planet_weight: 0.03
  # 时间惩罚：先关掉，nearest 对手不会拖时间。
  time_penalty: 0.0
  # 发射惩罚：关闭无差别惩罚，改用 wasted_attack_penalty 只罚送兵失败。
  launch_penalty: 0.0
  # 早期占领中立星球奖励：鼓励先吃近处中立，按 exp(-ETA/scale) 和开局衰减。
  neutral_capture_weight: 0.05
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  # 打掉敌方星球奖励：按星球生产力放大。
  enemy_capture_weight: 0.05
  # 丢失我方星球惩罚：独立于 step_clip，避免防守信号被裁剪到太小。
  lose_planet_penalty: 0.05
  # 送兵失败惩罚：我方舰队消失且估计撞到非友方星球时，按船数扣分。
  wasted_attack_penalty: 0.0002
  # 单步 shaped reward 裁剪：保护 dense reward 不会单步爆掉，盖过 terminal。
  step_clip: 0.05

model:
  hidden_size: 128
  use_cnn: true

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  # JAX vmap 并行环境数；越大 GPU/CPU 利用率越高，内存占用也越大。
  # CPU 上建议 64~256，GPU 上可尝试 512+。
  num_envs: 256
  # 每次 rollout 采集的步数；jax.lax.scan 展开，增大可提升吞吐但增大内存。
  rollout_steps: 256
  total_updates: 10000
  epochs: 4
  # minibatch_size 应能整除 num_envs * rollout_steps * max_planets。
  minibatch_size: 4096
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  max_grad_norm: 0.5
  norm_adv: true

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
