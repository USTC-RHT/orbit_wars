# Long training config for the V1 autoregressive actor.
#
# Launch:
#   python -m jax_agent.train_jax --config cfg_jax_autoregressive_long.yaml
#
# V1 note:
#   Autoregressive rollout currently trains against nearest only. Pool/self-play
#   can be re-enabled after autoregressive opponent inference is implemented.

seed: 42
run_name: "jax_fixed_pool_0520"
device: auto
save_dir: outputs
checkpoint_every: 100
log_every: 1
opponent: "pool"

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 10
  defense_top_k: 5

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  actor_type: autoregressive
  hidden_size: 128
  use_cnn: true
  use_transformer: true
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16
  max_action_tokens: 12
  end_bias_init: -3.0

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  rollout_steps: 32
  num_envs: 16
  total_updates: 10000
  epochs: 4
  minibatch_size: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_fire: 0.005
  ent_coef_target: 0.01
  ent_coef_amount: 0.005
  ent_schedule: linear
  ent_min_ratio: 0.2
  lr: 5e-5
  lr_schedule: warmup_cosine
  # 可能需要增加 warmup_updates 来稳定训练初期的 autoregressive 模型
  warmup_updates: 50
  min_lr_ratio: 0.1
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  target_kl: 0.02

self_play_update_interval: 100
pool_mode: fixed_pool
pool_start_phase: 1
pool_lag_interval: 100
promote_nearest_win_rate: 1.0
promote_consecutive_evals: 2

eval:
  enabled: true
  every: 200          # 默认间隔（fallback）
  nearest_every: 200  # nearest 每 200 步评估一次
  slow_every: 500     # sigma / tamrazov 每 500 步评估一次
  games: 20
  seed: 200000
  opponents: ["nearest", "sigma", "tamrazov"]

log_every: 1

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
  group: "autoregressive"
  tags:
    - autoregressive
    - v1
    - fixed_pool