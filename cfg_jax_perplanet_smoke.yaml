# Minimal smoke test config for the per-planet ActorCritic JAX agent.
#
# Launch:
#   conda run -n orbit-wars-lab python -m jax_agent.train_jax --config cfg_jax_perplanet_smoke.yaml

seed: 7
run_name: "perplanet_smoke"
device: auto
save_dir: outputs
checkpoint_every: 1000
log_every: 1
opponent: "nearest"

env:
  board_size: 100.0
  episode_steps: 32
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: false
  attack_top_k: 6
  defense_top_k: 3

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  step_clip: 0.0

model:
  actor_type: per_planet
  hidden_size: 64
  use_cnn: false
  use_transformer: false

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  rollout_steps: 1
  num_envs: 1
  total_updates: 1
  epochs: 1
  minibatch_size: 45
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  max_grad_norm: 0.5
  anneal_lr: false
  norm_adv: true
  target_kl: 0.05

eval:
  enabled: false

wandb:
  enabled: false
