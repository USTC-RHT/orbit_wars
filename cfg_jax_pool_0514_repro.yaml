# Reproduce the original 2026-05-14 JAX pool run.
#
# Source of truth:
#   jax_agent/JAX_POOL_0514_CKPT400.md
#   outputs/jax_pool_0514_jax/ckpt_000400.pkl["cfg"]
#
# This keeps the original training hyperparameters and legacy MLP-pointer model,
# but uses a new run_name so the existing outputs/jax_pool_0514_jax artifacts are
# not overwritten.
#
# Launch:
#   python -m jax_agent.train_jax --config cfg_jax_pool_0514_repro.yaml

seed: 42
run_name: "jax_pool_0514_repro_0520"
device: auto
save_dir: outputs
checkpoint_every: 100
log_every: 1

opponent: "pool"
opponent_pool:
  - nearest
opponent_pool_weights:
  - 1.0
self_play_update_interval: 50
pool_mode: fixed_pool
pool_start_phase: 1
pool_lag_interval: 50
promote_nearest_win_rate: 1.0
promote_consecutive_evals: 2
self_play_deterministic: true
alternate_player_sides: true

env:
  board_size: 100.0
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: true
  attack_top_k: 6
  defense_top_k: 3

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  hidden_size: 128
  use_cnn: false
  use_transformer: false
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

eval:
  enabled: true
  every: 100
  games: 20
  seed: 200000

ppo:
  rollout_steps: 128
  num_envs: 64
  total_updates: 5000
  epochs: 4
  minibatch_size: 4096
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.25
  ent_coef: 0.05
  ent_coef_fire: -1.0
  ent_coef_target: -1.0
  ent_coef_amount: -1.0
  ent_schedule: constant
  ent_min_ratio: 1.0
  vf_coef: 0.5
  lr: 3.0e-4
  lr_schedule: auto
  warmup_updates: 0
  min_lr_ratio: 0.0
  max_grad_norm: 0.5
  anneal_lr: true
  norm_adv: true
  clip_vloss: true
  target_kl: 0.03

wandb:
  enabled: true
  project: "orbit-wars-rl"
  entity:
  mode: "online"
  group:
  tags: []
