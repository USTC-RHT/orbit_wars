# 从 jax_pool_0514/ckpt_000400.pkl 继续 fine-tune 的 legacy 配置。
#
seed: 42
run_name: "jax_pool_0514_resume_entropy_heads"
save_dir: outputs
checkpoint_every: 100
opponent: "checkpoint"
init_from_checkpoint: "outputs/jax_pool_0514_jax/ckpt_000400.pkl"
start_update_from_checkpoint: true
opponent_checkpoint: "outputs/jax_pool_0514_jax/ckpt_000400.pkl"
eval_checkpoint: "outputs/jax_pool_0514_jax/ckpt_000400.pkl"

env:
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: True
  attack_top_k: 6
  defense_top_k: 3

reward:
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  hidden_size: 128
  use_cnn: False
  use_transformer: False
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  num_envs: 64
  rollout_steps: 128
  total_updates: 5000
  epochs: 4
  minibatch_size: 4096
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.15
  vf_coef: 0.5
  ent_coef: 0.02
  ent_coef_fire: 0.02
  ent_coef_target: 0.02
  ent_coef_amount: 0.02
  ent_schedule: constant
  ent_min_ratio: 1.0
  lr: 1.0e-4
  lr_schedule: auto
  warmup_updates: 0
  min_lr_ratio: 0.0
  max_grad_norm: 0.5
  norm_adv: true
  target_kl: 0.03
  anneal_lr: true

self_play_update_interval: 50
pool_mode: fixed
pool_start_phase: 2
pool_include_nearest: true
pool_lag_interval: 50
pool_max_size: 4
promote_nearest_win_rate: 1.0
promote_consecutive_evals: 2

eval:
  enabled: true
  every: 100
  games: 20
  seed: 200000

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
