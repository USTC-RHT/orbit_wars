# 设计原则：
#   - 关闭所有 dense shaping，只用终局胜负奖励（胜 +1，负/平 -1）。
#   - opponent: "pool" + pool_mode: lag_checkpoint — 二阶段课程训练：
#       Phase 1：只对 pool_lag_interval 步前 checkpoint 打，nearest 仅用于 eval benchmark。
#       Phase 2：对 selfplay-current / selfplay-lag 轮流训练。
#
# 启动示例（从 rl-agent/ 目录）：
#   python -m jax_agent.train_jax --config cfg_jax_selfplay.yaml

seed: 42
run_name: "jax_transformer_lag_checkpoint_0519"
save_dir: outputs
checkpoint_every: 100
opponent: "pool"

env:
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: True
  # attack_top_k: 6
  # defense_top_k: 3
  attack_top_k: 10
  defense_top_k: 5

reward:
  # 只开终局奖励；胜 +1，负 −1，平局按得分决定。
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  hidden_size: 128
  use_cnn: True
  use_transformer: True
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  num_envs: 64
  rollout_steps: 128
  total_updates: 5000
  epochs: 4            # 1→4：让 KL 早停真正起作用（epochs=1 时早停永远不触发）
  minibatch_size: 4096
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.15      # 0.05→0.15：Transformer 漂移大，0.05 会全饱和导致梯度为零
  vf_coef: 0.5
  ent_coef: 0.05       # 0.03→0.05：防止熵过早塌缩（Transformer 收敛更快）
  ent_coef_fire: 0.02
  ent_coef_target: 0.04
  ent_coef_amount: 0.01
  ent_schedule: linear_decay
  ent_min_ratio: 0.25
  lr: 3e-4
  lr_schedule: warmup_cosine
  warmup_updates: 100
  min_lr_ratio: 0.05
  max_grad_norm: 0.5
  norm_adv: true
  target_kl: 0.03      # 0.005→0.03：配合 epochs=4 的合理 KL 阈值

# 每隔多少 update 把 learner 权重同步给冻结对手（selfplay-current）
self_play_update_interval: 50
# 对手池配置（二阶段 lag_checkpoint 模式）
pool_mode: lag_checkpoint        # 新接口：lag 对手严格按 pool_lag_interval 延迟发布
pool_start_phase: 1              # 1=从 Phase1(只打 lag checkpoint) 开始；2=跳过直接进 Phase2(selfplay)
pool_lag_interval: 50            # 每隔多少 update 更新 lagged 对手权重（对抗 50 步前的自己）
pool_lag_checkpoint_phase1_opponents:
  - selfplay-lag
pool_lag_checkpoint_phase2_opponents:
  - selfplay-current
  - selfplay-lag
promote_nearest_win_rate: 1.0    # nearest win_rate 达到此阈值触发升阶（全胜才升）
promote_consecutive_evals: 2     # 连续多少次评估超过阈值才升阶至 Phase 2

eval:
  enabled: true
  every: 100         # 每 100 次 update 评估一次
  games: 20          # 每次评估局数
  seed: 200000

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
