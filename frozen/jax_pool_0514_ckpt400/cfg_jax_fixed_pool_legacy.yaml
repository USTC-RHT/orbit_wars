# 旧架构 + 二阶段 fixed pool 配置。
# 基于 cfg_jax_selfplay.yaml 复制，仅切换：
#   - run_name，避免覆盖现有实验
#   - model.use_transformer: false，使用旧 MLP/CNN 架构
#   - pool_mode: fixed，使用旧版二阶段 pool
#
# 启动示例（从 rl-agent/ 目录）：
#   python -m jax_agent.train_jax --config cfg_jax_fixed_pool_legacy.yaml

seed: 42
run_name: "jax_fixed_pool_legacy_0515"
save_dir: outputs
checkpoint_every: 100
opponent: "pool"

env:
  episode_steps: 500
  ship_bucket_count: 8
  max_planets: 45
  max_ships: 500.0
  max_production: 5.0
  target_filter_enabled: True
  attack_top_k: 10
  defense_top_k: 5

reward:
  # 只开终局奖励；胜 +1，负 -1，平局按得分决定。
  terminal_weight: 1.0
  ships_weight: 0.0
  production_weight: 0.0
  planet_weight: 0.0
  time_penalty: 0.0
  launch_penalty: 0.0
  neutral_capture_weight: 0.0
  neutral_capture_eta_scale: 12.0
  neutral_capture_early_steps: 150
  enemy_capture_weight: 0.0
  lose_planet_penalty: 0.0
  wasted_attack_penalty: 0.0
  step_clip: 0.0

model:
  hidden_size: 128
  use_cnn: True
  use_transformer: False
  num_transformer_layers: 2
  num_heads: 4
  max_fleet_tokens: 16

state_norm:
  enabled: true
  clip: 5.0
  eps: 1.0e-8

ppo:
  num_envs: 64
  rollout_steps: 128
  total_updates: 5000
  epochs: 4
  minibatch_size: 4096
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.15
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 1.0e-4
  max_grad_norm: 0.5
  norm_adv: true
  target_kl: 0.05
  anneal_lr: true

# 每隔多少 update 把 learner 权重同步给冻结对手（selfplay-current）
self_play_update_interval: 50
# 对手池配置
pool_mode: fixed                 # fixed=旧版二阶段 pool；pfsp=胜率加权采样
pool_lag_interval: 50            # 每隔多少 update 更新 lagged 对手权重
pool_max_size: 4                 # fixed 模式不使用，保留字段以便切换
promote_nearest_win_rate: 1.0    # nearest win_rate 达到此阈值触发升阶
promote_consecutive_evals: 2     # 连续多少次评估超过阈值才升阶至 Phase 2

eval:
  enabled: true
  every: 100
  games: 20
  seed: 200000

wandb:
  enabled: true
  project: "orbit-wars-rl"
  mode: "online"
