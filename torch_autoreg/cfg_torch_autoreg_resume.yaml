# Torch autoregressive PPO resume config.
# Source checkpoint is already converted into torch_autoreg/checkpoints/ckpt_last.pt.
# Launch:
#   python -m torch_autoreg.train --config torch_autoreg/cfg_torch_autoreg_resume.yaml

seed: 42
run_name: "torch_autoreg_32700_resume_mixed_pool"
device: cuda
torch_threads: 4
log_every: 1

train:
  checkpoint: checkpoints/ckpt_last.pt
  out_dir: checkpoints
  checkpoint_every: 400
  freeze_normalizer: false

opponent:
  type: mixed
  learner_player: -1
  pool:
    # 60% current-policy self-play.
    - name: self_play
      type: self
      weight: 0.60

    # 30% external evaluation opponent: producer.
    - name: producer
      type: external
      weight: 0.30
      agent_dir: ../agents/external/slawekbiel-producer

    # 10% old strongest policies, split between ckpt 48900 and 32700.
    # These point to project-local ONNX checkpoint agent dirs under rl-agent/agents.
    - name: ckpt_48900
      type: external
      weight: 0.05
      agent_dir: ../agents/mine/fixed-pool-tgtmask-0526-ckpt48900-onnx-producer-hybrid
    - name: ckpt_32700
      type: external
      weight: 0.05
      agent_dir: ../agents/mine/fixed-pool-tgtmask-0526-ckpt32700-onnx-producer-hybrid

rollout:
  num_envs: 32
  num_workers: 8
  device: cpu
  rollout_steps: 64

ppo:
  total_updates: 50000
  epochs: 4
  minibatch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_fire: 0.005
  ent_coef_target: 0.01
  ent_coef_amount: 0.005
  ent_schedule: linear
  ent_min_ratio: 0.2
  lr: 5.0e-5
  lr_schedule: warmup_cosine
  warmup_updates: 50
  min_lr_ratio: 0.1
  anneal_lr: true
  max_grad_norm: 0.5
  norm_adv: true
  target_kl: 0.02

eval:
  enabled: true
  every: 400
  games: 20
  seed: 200000
  player: 1
  opponents:
    - name: producer
      type: external
      agent_dir: ../agents/external/slawekbiel-producer
    - name: ckpt_48900
      type: external
      agent_dir: ../agents/mine/fixed-pool-tgtmask-0526-ckpt48900-onnx-producer-hybrid
    - name: ckpt_32700
      type: external
      agent_dir: ../agents/mine/fixed-pool-tgtmask-0526-ckpt32700-onnx-producer-hybrid
